<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Costura – Boceto</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#123d28;--g7:#1f6b45;--g5:#2f8f5b;--g2:#cfe9d9;--g1:#eaf6ee;--bg:#f6fbf8;--w:#fff;--tx:#14231b;--mu:#4b6356;--am:#a85d00;--amb:#fff1d9;--rd:#a32a2a;--rdb:#fde8e8}
*{box-sizing:border-box;margin:0}
html{font-size:20px}
html.big{font-size:24px}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;display:flex;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--g5);outline-offset:2px}
.i{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:270px;background:var(--g9);color:#fff;padding:1.2rem .9rem;display:flex;flex-direction:column;gap:.5rem;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.2rem;padding:.4rem .6rem 1.2rem}
.logo span{background:var(--g5);border-radius:14px;padding:.5rem;display:grid}
nav button{display:flex;align-items:center;gap:.8rem;width:100%;padding:.9rem 1rem;border:0;border-radius:16px;background:none;color:#d6efe1;font-weight:700;cursor:pointer;text-align:left}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:var(--w);color:var(--g9)}
.zoom{margin-top:auto;border:2px solid var(--g5);background:none;color:#fff;border-radius:16px;padding:.8rem;font-weight:800;cursor:pointer;display:flex;gap:.6rem;align-items:center;justify-content:center}
main{flex:1;padding:2rem clamp(1rem,3vw,2.5rem) 3rem;max-width:1200px}
h1{font-size:1.9rem;font-weight:800;color:var(--g9);margin-bottom:.3rem}
h2{font-size:1.25rem;font-weight:800;color:var(--g9);display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
h2 .i{color:var(--g5)}
.sub{color:var(--mu);margin-bottom:1.6rem}
.card{background:var(--w);border:2px solid var(--g2);border-radius:22px;padding:1.4rem}
.grid{display:grid;gap:1.2rem}
.stats{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:1.2rem}
.stat{display:flex;gap:1rem;align-items:center}
.stat .ic{background:var(--g1);color:var(--g7);border-radius:18px;padding:.9rem;display:grid}
.stat.main{background:var(--g7);border-color:var(--g7);color:#fff}
.stat.main .ic{background:rgba(255,255,255,.18);color:#fff}
.stat small{display:block;color:var(--mu);font-weight:700}
.stat.main small{color:#d6efe1}
.stat b{font-size:1.7rem;font-weight:800}
.two{grid-template-columns:1.1fr 1fr}
.bars{display:flex;align-items:flex-end;gap:1rem;height:190px;padding-top:.5rem}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3rem;font-weight:700;text-align:center;font-size:.85rem}
.bar i{display:block;width:100%;background:var(--g5);border-radius:12px 12px 0 0}
.bar:last-child i{background:var(--g9)}
.task{display:flex;gap:.9rem;align-items:center;padding:.9rem 0;border-bottom:2px solid var(--g1);cursor:pointer}
.task:last-child{border:0}
.box{width:2rem;height:2rem;border-radius:10px;border:3px solid var(--g5);display:grid;place-items:center;flex:none;color:#fff}
.task.done .box{background:var(--g5)}
.task.done .t{text-decoration:line-through;color:var(--mu)}
.t b{display:block}.t small{color:var(--mu)}
.chip{display:inline-block;padding:.25rem .8rem;border-radius:99px;font-weight:800;font-size:.85rem;background:var(--g1);color:var(--g7);white-space:nowrap}
.chip.mid{background:var(--amb);color:var(--am)}
.chip.no{background:var(--rdb);color:var(--rd)}
.chip.ok{background:var(--g2);color:var(--g9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:56px;padding:.6rem 1.3rem;border-radius:16px;border:0;background:var(--g7);color:#fff;font-weight:800;cursor:pointer}
.btn:hover{background:var(--g9)}
.btn.out{background:var(--w);color:var(--g7);border:3px solid var(--g5)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.list{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.cl{cursor:pointer;text-align:left;width:100%;transition:.15s}
.cl:hover{border-color:var(--g5);transform:translateY(-2px)}
.cl .h{display:flex;gap:.9rem;align-items:center;margin-bottom:.8rem}
.av{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--g2);color:var(--g9);display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.cl small{color:var(--mu);display:block}
.row{display:flex;justify-content:space-between;gap:.8rem;align-items:center;padding:.5rem 0}
.tabs{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.2rem 0}
.tab{border:3px solid var(--g2);background:var(--w);border-radius:16px;padding:.7rem 1.2rem;font-weight:800;cursor:pointer;min-height:56px}
.tab.on{background:var(--g7);border-color:var(--g7);color:#fff}
.det{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.meds{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
label{font-weight:700;display:block;font-size:.9rem;color:var(--mu)}
input,select{width:100%;min-height:52px;padding:.5rem .9rem;border:3px solid var(--g2);border-radius:14px;background:var(--w)}
input:focus,select:focus{border-color:var(--g5);outline:none}
.sel{margin-bottom:1rem}
.steps{display:grid;gap:.6rem}
.step{display:flex;gap:.8rem;align-items:center;padding:.8rem 1rem;border-radius:16px;border:3px solid var(--g2);background:var(--w);font-weight:800;cursor:pointer;text-align:left;min-height:56px}
.step.past{background:var(--g1);color:var(--g7);border-color:var(--g1)}
.step.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.add{display:flex;gap:.6rem;margin-top:.8rem}
.add .btn{padding:.6rem 1rem}
.x{border:0;background:none;color:var(--rd);cursor:pointer;padding:.4rem;border-radius:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.ph{aspect-ratio:1;border-radius:16px;background:var(--g1);display:grid;place-items:center;color:var(--g5);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.up{cursor:pointer;border:3px dashed var(--g5);color:var(--g7);font-weight:800;text-align:center;font-size:.8rem;padding:.3rem}
.sum{background:var(--g1);border-radius:16px;padding:1rem;margin:1rem 0}
.sum .row{border-bottom:2px solid var(--g2)}
.sum .row:last-child{border:0;font-size:1.25rem;font-weight:800;color:var(--g9)}
.back{margin-bottom:1rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--g9);color:#fff;padding:1rem 1.6rem;border-radius:16px;font-weight:800;display:flex;gap:.6rem;align-items:center;z-index:9}
.toast[hidden]{display:none}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:760px){
 body{flex-direction:column}
 aside{width:100%;height:auto;position:fixed;bottom:0;left:0;z-index:5;flex-direction:row;padding:.4rem;border-radius:20px 20px 0 0}
 .logo,.zoom span{display:none}.zoom{margin:0;padding:.6rem;width:auto}
 nav{display:flex;flex:1}nav button{flex-direction:column;gap:.1rem;padding:.5rem;font-size:.75rem;text-align:center;align-items:center}
 main{padding-bottom:7rem}
 .meds{grid-template-columns:1fr}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></symbol>
<symbol id="i-money" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 16V8l-9-5-9 5v8l9 5z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
<symbol id="i-ruler" viewBox="0 0 24 24"><path d="M21.3 8.7l-5.99-6a1 1 0 0 0-1.42 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10.1a1 1 0 0 0 0-1.4z"/><path d="M7.5 10.5l2 2M10.5 7.5l2 2M13.5 4.5l2 2M4.5 13.5l2 2"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
</svg>

<aside>
  <div class="logo"><span><svg class="i"><use href="#i-cut"/></svg></span>Taller de Costura</div>
  <nav>
    <button data-v="home" onclick="go('home')"><svg class="i"><use href="#i-home"/></svg>Inicio</button>
    <button data-v="clients" onclick="go('clients')"><svg class="i"><use href="#i-users"/></svg>Clientes</button>
    <button data-v="pay" onclick="go('pay')"><svg class="i"><use href="#i-money"/></svg>Cobros</button>
  </nav>
  <button class="zoom" onclick="document.documentElement.classList.toggle('big')"><svg class="i"><use href="#i-text"/></svg><span>Letra más grande</span></button>
</aside>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const money = n => '$ ' + n.toLocaleString('es-AR');
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const ESTADOS = ['Por empezar','En proceso','Casi terminada','Lista para retirar','Entregada'];
const MED = {
  tutu:['Cintura','Cadera','Largo de pollera','Contorno de busto','Largo de torso','Hombro'],
  vestido:['Busto','Cintura','Cadera','Largo de falda','Largo de espalda','Hombro','Manga','Escote'],
  pantalon:['Cintura','Cadera','Tiro','Largo','Rodilla','Basta'],
  capa:['Largo','Contorno de cuello','Ancho de hombros']
};
const TIPOS = {tutu:'Tutú / pollera',vestido:'Vestido',pantalon:'Pantalón',capa:'Capa'};

let data = [
 {id:1,grupo:true,nombre:'Ballet Estrella',detalle:'Fiesta de fin de año · 8 bailarinas',entrega:'12 de diciembre',pagado:30000,
  fotos:[],faltan:[{t:'Elástico blanco, 3 metros',ok:false},{t:'Cierres de 40 cm (8)',ok:true}],
  prendas:[{n:'Tutú',tipo:'tutu',estado:1,precio:28000,med:{Cintura:'62',Cadera:'88'}},
           {n:'Corpiño',tipo:'vestido',estado:0,precio:18000,med:{}},
           {n:'Capa',tipo:'capa',estado:0,precio:15000,med:{}}]},
 {id:2,grupo:false,nombre:'Marta Gómez',detalle:'Vestido de fiesta · 15 años de su nieta',entrega:'28 de noviembre',pagado:40000,
  fotos:[],faltan:[{t:'Botones forrados (12)',ok:false}],
  prendas:[{n:'Vestido de fiesta',tipo:'vestido',estado:2,precio:85000,med:{Busto:'96',Cintura:'78',Cadera:'104'}}]},
 {id:3,grupo:false,nombre:'Lucía Fernández',detalle:'Arreglo de pantalón',entrega:'3 de noviembre',pagado:6000,
  fotos:[],faltan:[],
  prendas:[{n:'Pantalón',tipo:'pantalon',estado:3,precio:6000,med:{Basta:'4'}}]}
];
let tasks = [
 {t:'Cortar la tela del corpiño',s:'Ballet Estrella · hoy',done:false},
 {t:'Pedir elástico blanco',s:'Ballet Estrella · mañana',done:false},
 {t:'Probar vestido a Marta',s:'Marta Gómez · viernes',done:false},
 {t:'Avisar que el pantalón está listo',s:'Lucía Fernández',done:true}
];
let view='home', cur=null, pi=0;

const total = c => c.prendas.reduce((a,p)=>a+p.precio,0);
const pagoChip = c => { const t=total(c); return c.pagado>=t?['Pagado completo','ok']:c.pagado>0?['Con seña','mid']:['Sin pago','no']; };
const ini = n => n.split(' ').map(w=>w[0]).slice(0,2).join('');
function toast(m){const t=$('#toast');t.innerHTML=ico('ok')+m;t.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>t.hidden=true,2200);}
function go(v,id){view=v;cur=id||null;pi=0;render();window.scrollTo(0,0);}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='detail'?'clients':view)));
  $('#main').innerHTML = {home:home,clients:clients,pay:pay,detail:detail}[view]();
}

function home(){
  const cob = data.reduce((a,c)=>a+c.pagado,0), deb = data.reduce((a,c)=>a+total(c)-c.pagado,0);
  const enProc = data.flatMap(c=>c.prendas).filter(p=>p.estado<3).length;
  const sem = [['Sem 1',38000],['Sem 2',52000],['Sem 3',41000],['Esta',cob]];
  const mx = Math.max(...sem.map(s=>s[1]));
  return `<h1>Buen día 👋</h1><p class="sub">Esto es lo que hay para hoy en el taller.</p>
  <div class="grid stats">
    <div class="card stat main"><div class="ic">${ico('money')}</div><div><small>Cobrado este mes</small><b>${money(cob+131000)}</b></div></div>
    <div class="card stat"><div class="ic">${ico('flag')}</div><div><small>Falta cobrar</small><b>${money(deb)}</b></div></div>
    <div class="card stat"><div class="ic">${ico('cut')}</div><div><small>Prendas en trabajo</small><b>${enProc}</b></div></div>
  </div>
  <div class="grid two">
    <div class="card"><h2>${ico('list')}Para hacer</h2>
      ${tasks.map((k,i)=>`<div class="task ${k.done?'done':''}" onclick="tasks[${i}].done=!tasks[${i}].done;render()"><div class="box">${k.done?ico('ok'):''}</div><div class="t"><b>${k.t}</b><small>${k.s}</small></div></div>`).join('')}
      <div class="add"><button class="btn out" onclick="toast('Aquí se agregará una tarea nueva')">${ico('plus')}Nueva tarea</button></div>
    </div>
    <div class="card"><h2>${ico('money')}Ingresos por semana</h2>
      <div class="bars">${sem.map(s=>`<div class="bar">${money(s[1]).replace('$ ','$')}<i style="height:${s[1]/mx*70}%"></i>${s[0]}</div>`).join('')}</div>
    </div>
  </div>`;
}

function clients(){
  return `<div class="top"><div><h1>Clientes</h1><p class="sub">Toque un nombre para ver sus prendas y medidas.</p></div>
    <button class="btn" onclick="toast('Aquí se creará un cliente o grupo nuevo')">${ico('plus')}Nuevo cliente</button></div>
  <div class="grid list">${data.map(c=>{const [l,k]=pagoChip(c);return `
    <button class="card cl" onclick="go('detail',${c.id})">
      <div class="h"><div class="av">${c.grupo?ico('users'):ini(c.nombre)}</div><div><b>${c.nombre}</b><small>${c.detalle}</small></div></div>
      <div class="row"><span>${c.prendas.length} prenda${c.prendas.length>1?'s':''}</span><span class="chip ${k}">${l}</span></div>
      <div class="row"><span>Entrega: <b>${c.entrega}</b></span></div>
      ${c.faltan.some(f=>!f.ok)?`<span class="chip mid">${ico('box')} Falta traer material</span>`:''}
    </button>`}).join('')}</div>`;
}

function pay(){
  return `<h1>Cobros</h1><p class="sub">Quién pagó y quién todavía debe.</p>
  <div class="grid">${data.map(c=>{const [l,k]=pagoChip(c);return `<div class="card"><div class="row"><b style="font-size:1.2rem">${c.nombre}</b><span class="chip ${k}">${l}</span></div>
   <div class="row"><span>Total</span><b>${money(total(c))}</b></div><div class="row"><span>Pagó</span><b>${money(c.pagado)}</b></div>
   <div class="row"><span>Debe</span><b>${money(Math.max(0,total(c)-c.pagado))}</b></div></div>`}).join('')}</div>`;
}

function detail(){
  const c = data.find(x=>x.id===cur), p = c.prendas[pi], [l,k] = pagoChip(c), t = total(c);
  return `<button class="btn out back" onclick="go('clients')">${ico('back')}Volver a clientes</button>
  <div class="top"><div><h1>${c.nombre}</h1><p class="sub">${c.detalle} · Entrega: ${c.entrega}</p></div><span class="chip ${k}">${l}</span></div>
  <div class="tabs">${c.prendas.map((x,i)=>`<button class="tab ${i===pi?'on':''}" onclick="pi=${i};render()">${x.n}</button>`).join('')}
    <button class="tab" onclick="toast('Aquí se agregará otra prenda')">${ico('plus')} Agregar prenda</button></div>
  <div class="grid det">
    <div class="card"><h2>${ico('ruler')}Medidas (cm)</h2>
      <div class="sel"><label>Tipo de prenda</label><select onchange="p.tipo=this.value;render()">${Object.entries(TIPOS).map(([v,n])=>`<option value="${v}" ${p.tipo===v?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="meds">${MED[p.tipo].map(m=>`<div><label>${m}</label><input type="number" inputmode="decimal" value="${p.med[m]||''}" oninput="p.med['${m}']=this.value"></div>`).join('')}</div>
    </div>
    <div class="card"><h2>${ico('cut')}Estado de la prenda</h2>
      <div class="steps">${ESTADOS.map((e,i)=>`<button class="step ${i<p.estado?'past':''} ${i===p.estado?'on':''}" onclick="p.estado=${i};render();toast('Estado: ${e}')">${i<=p.estado?ico('ok'):'<span style="width:1.4em"></span>'}${e}</button>`).join('')}</div>
    </div>
    <div class="card"><h2>${ico('box')}Falta que el cliente traiga</h2>
      ${c.faltan.length?c.faltan.map((f,i)=>`<div class="task ${f.ok?'done':''}"><div class="box" onclick="c.faltan[${i}].ok=!c.faltan[${i}].ok;render()">${f.ok?ico('ok'):''}</div><div class="t" style="flex:1" onclick="c.faltan[${i}].ok=!c.faltan[${i}].ok;render()"><b>${f.t}</b><small>${f.ok?'Ya lo trajo':'Pendiente'}</small></div><button class="x" aria-label="Quitar" onclick="c.faltan.splice(${i},1);render()">${ico('x')}</button></div>`).join(''):'<p class="sub">No falta nada. Agregue lo que el cliente deba traer.</p>'}
      <div class="add"><input id="nf" placeholder="Ej: botones, cierre, cinta…"><button class="btn" onclick="const v=$('#nf').value.trim();if(v){c.faltan.push({t:v,ok:false});render()}">${ico('plus')}Agregar</button></div>
    </div>
    <div class="card"><h2>${ico('cam')}Fotos del cliente</h2>
      <div class="photos">${c.fotos.map(u=>`<div class="ph"><img src="${u}" alt="Foto"></div>`).join('')}
        <label class="ph up">${ico('plus')}<input type="file" accept="image/*" hidden onchange="if(this.files[0]){c.fotos.push(URL.createObjectURL(this.files[0]));render()}">Subir foto</label></div>
    </div>
    <div class="card"><h2>${ico('money')}Precio y pagos</h2>
      <div class="sel"><label>Precio de "${p.n}"</label><input type="number" value="${p.precio}" onchange="p.precio=+this.value||0;render()"></div>
      <div class="sum">${c.prendas.map(x=>`<div class="row"><span>${x.n}</span><b>${money(x.precio)}</b></div>`).join('')}
        <div class="row"><span>Total</span><b>${money(t)}</b></div>
        <div class="row"><span>Ya pagó</span><b>${money(c.pagado)}</b></div>
        <div class="row"><span>Falta pagar</span><b>${money(Math.max(0,t-c.pagado))}</b></div></div>
      <label>Registrar un pago</label>
      <div class="add"><input id="ab" type="number" placeholder="Monto"><button class="btn" onclick="const v=+$('#ab').value;if(v>0){c.pagado+=v;render();toast('Pago registrado')}">${ico('ok')}Guardar</button></div>
    </div>
  </div>`;
}
render();
</script>
</body>
</html>
